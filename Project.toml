name = "Nautilus"
uuid = "0c5b9d3e-7a41-4d2f-9e6c-8b1f4a2d5c73"
authors = ["Fabien Baron <fbaron@gsu.edu>"]
version = "0.1.0"

# A Julia port of nautilus (Lange 2023, MNRAS 525, 3181; github.com/johannesulf/nautilus),
# importance nested sampling with neural-network boosted space exploration.
#
# The dependency list is deliberately short. The two pieces of machinery the Python package
# takes from scikit-learn -- a 2-component Gaussian mixture for splitting bounds, and the
# MLP likelihood emulator -- are implemented here instead (src/gmm.jl, src/mlp.jl). Both are
# small and specialised enough that a general-purpose package would be a worse fit than a
# direct implementation, and it keeps a neural-network framework out of the graph entirely.
[deps]
Clustering = "aaaa29a8-35af-508c-8bc3-b662a17a0fe5"
Distributions = "31c24e10-a181-5473-b8eb-7969acd0382f"
LinearAlgebra = "37e2e46d-f89d-539d-b4ee-838fcccc9c8e"
LogExpFunctions = "2ab3a3ac-af41-5b50-aa03-7779005ae688"
PrecompileTools = "aea7be01-6a6a-4083-8856-8a6e6704d82a"
Printf = "de0858da-6303-5e67-8744-51eddeeeb8d7"
Random = "9a3f8284-a2c9-5f02-9a11-845980a1fd5c"
SpecialFunctions = "276daf66-3868-5448-9aa4-cd146d93841b"
Statistics = "10745b16-79ce-11e8-11f9-7d13ad32a3b2"
StatsBase = "2913bbd2-ae8a-5f71-8c99-4fb6c76f3a91"

[compat]
Clustering = "0.15"
Distributions = "0.25"
LogExpFunctions = "0.3, 1"
PrecompileTools = "1"
SpecialFunctions = "2"
StatsBase = "0.34, 0.35"
julia = "1.10"

# HDF5 is a test dependency only: it reads test/fixtures/fixtures.h5, the reference values
# dumped from the Python package. The port itself does no I/O.
[extras]
HDF5 = "f67ccb44-e63f-5c2f-98bd-6dc0ccc4ba2f"
StableRNGs = "860ef19b-820b-49d6-a774-d7a799459cd3"
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"

[targets]
test = ["Test", "StableRNGs", "HDF5"]
